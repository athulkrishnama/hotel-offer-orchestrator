services:
  # --- Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- PostgreSQL ---
  postgres:
    image: postgres:12-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Temporal Server (dev) ---
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Temporal Web UI (optional, for debugging) ---
  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_started

  # --- API Server ---
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=hotel-task-queue
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_BASE_URL=http://api:3000
      - SUPPLIER_FAILURE_RATE=0.2
      - SUPPLIER_MIN_DELAY_MS=200
      - SUPPLIER_MAX_DELAY_MS=3000
      - HEALTH_CHECK_INTERVAL_MS=10000
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: on-failure

  # --- Temporal Worker ---
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=hotel-task-queue
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_BASE_URL=http://api:3000
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    restart: on-failure
